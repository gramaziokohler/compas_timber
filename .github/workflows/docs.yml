name: docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: compas-dev/compas-actions/docs@v1
        with:
          python-version: '3.12'
          extras: dev
          config-file: mkdocs.yml
          # griffe reports pre-existing docstring/signature mismatches as warnings
          strict: false
