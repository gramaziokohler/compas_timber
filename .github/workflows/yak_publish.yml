name: publish_yak

# There is nothing to publish from main: the Grasshopper components and the
# yakerize / publish-yak invoke tasks this workflow drives were moved to
# timber_design. It is kept here only so that it stays runnable at all --
# a workflow_dispatch workflow has to exist on the default branch to appear
# in the Actions list, and the LTS-1.x.x branch still publishes its yak
# package using its own copy of this file.
#
# To publish the LTS package: Actions -> publish_yak -> Run workflow ->
# Branch: LTS-1.x.x. The copy of this file on the selected branch is the one
# that runs, so the real steps live there, not here. Keep the inputs below in
# sync with that copy so the form is correct whichever branch renders it.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Choose deployment environment"
        required: true
        type: choice
        options:
          - test
          - prod

permissions:
  contents: read

jobs:
  wrong-branch:
    name: Nothing to publish from this branch
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        env:
          SELECTED_REF: ${{ github.ref_name }}
        run: |
          echo "::error::compas_timber does not build a yak package on '$SELECTED_REF'."
          echo "::error::Re-run this workflow with the Branch dropdown set to LTS-1.x.x."
          exit 1
