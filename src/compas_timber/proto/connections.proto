// Polymorphic wrapper: any concrete Joint.
message JointData {
  oneof joint {
    BallNodeJointData ball_node_joint = 1;
    ButtJointData butt_joint = 2;
    CompositeJointData composite_joint = 3;
    ISimpleScarfData i_simple_scarf = 4;
    LButtJointData l_butt_joint = 5;
    LFrenchRidgeLapJointData l_french_ridge_lap_joint = 6;
    LLapJointData l_lap_joint = 7;
    LMiterJointData l_miter_joint = 8;
    LTenonMortiseJointData l_tenon_mortise_joint = 9;
    LapJointData lap_joint = 10;
    MortiseTenonJointData mortise_tenon_joint = 11;
    PanelLButtJointData panel_l_butt_joint = 12;
    PanelLLayerButtJointData panel_l_layer_butt_joint = 13;
    PanelMiterJointData panel_miter_joint = 14;
    PanelTButtJointData panel_t_butt_joint = 15;
    PlateLButtJointData plate_l_butt_joint = 16;
    PlateMiterJointData plate_miter_joint = 17;
    PlateTButtJointData plate_t_butt_joint = 18;
    TBirdsmouthJointData t_birdsmouth_joint = 19;
    TButtJointData t_butt_joint = 20;
    TDovetailJointData t_dovetail_joint = 21;
    TLapJointData t_lap_joint = 22;
    TOliGinaJointData t_oli_gina_joint = 23;
    TStepJointData t_step_joint = 24;
    TTenonMortiseJointData t_tenon_mortise_joint = 25;
    XLapJointData x_lap_joint = 26;
    XNotchJointData x_notch_joint = 27;
    YButtJointData y_butt_joint = 28;
  }
}