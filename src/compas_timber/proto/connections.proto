syntax = "proto3";

package compas_timber.proto;

import "compas_pb/generated/geometry.proto";
import "compas_pb/generated/message.proto";
import "compas_timber/proto/elements.proto";
import "compas_timber/proto/panel_features.proto";

// Joints and joint candidates (compas_timber.connections).
//
// Proto has no inheritance, so each concrete joint message carries the fields
// of its whole MRO flattened in base->derived order. Where a subclass removes
// an inherited key (LFrenchRidgeLapJoint deletes `cut_plane_bias`) the field
// is likewise absent here.
//
// Abstract joints (Joint, PlateJoint, PlateButtJoint, PanelJoint) get no
// message of their own; only instantiable classes are represented.

message CutPlaneSpecData {
  string guid = 1;
  optional string name = 2;
  optional int32 ref_side_index = 10;
  optional double angle = 11;
  optional double offset = 12;
}

message MiterPlaneSpecData {
  string guid = 1;
  optional string name = 2;
  optional int32 ref_side_index = 10;
  optional double angle_x = 11;
  optional double angle_y = 12;
  optional double offset = 13;
}

// JointCandidate merges an open-ended `_extra_kwargs` dict into its __data__.
message JointCandidateData {
  string guid = 1;
  optional string name = 2;
  repeated string element_guids = 10;
  optional int32 topology = 11;
  optional compas_pb.data.PointData location = 12;
  optional double distance = 13;
  map<string, compas_pb.data.AnyData> extra_kwargs = 14;
}

