// Authoring helper. `processing` is a class object and `elements` are live
// Element instances, neither of which can be embedded here without making
// fabrication.proto depend on elements.proto. The class is stored by name and
// the elements by guid, which is what a consumer needs to resolve them.
message BTLxFromGeometryDefinitionData {
  GuidRef guid = 1;
  optional string name = 2;
  string processing_name = 10;
  repeated compas_pb.data.AnyData geometries = 11;
  repeated GuidRef element_guids = 12;
  map<string, compas_pb.data.AnyData> kwargs = 13;
}

