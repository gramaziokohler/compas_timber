syntax = "proto3";

package compas_timber.proto;

import "compas_pb/generated/geometry.proto";
import "compas_pb/generated/message.proto";

// BTLx processings (compas_timber.fabrication).
//
// Proto has no inheritance, so the fields of the BTLxProcessing base class
// (ref_side_index, priority, process_id) are copied into every concrete
// message, along with the guid/name carried by the compas serialization
// envelope. Field numbers 1-5 are reserved for those; processing-specific
// fields start at 10.
//
// Scalars are `optional` so that a None in __data__ round-trips as absent
// rather than collapsing to the proto3 default (0 / "" / false).

message ContourData {
  string guid = 1;
  optional string name = 2;
  compas_pb.data.PolylineData polyline = 10;
  optional double depth = 11;
  optional bool depth_bounded = 12;
  repeated double inclination = 13;
}

message DualContourData {
  string guid = 1;
  optional string name = 2;
  compas_pb.data.PolylineData principal_contour = 10;
  compas_pb.data.PolylineData associated_contour = 11;
  optional bool depth_bounded = 12;
}

