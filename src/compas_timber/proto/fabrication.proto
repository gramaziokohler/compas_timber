  optional bool counter_sink = 13;
  optional string tool_position = 14;
  optional bool depth_bounded = 15;
}
// Authoring helper. `processing` is a class object and `elements` are live
// Element instances, neither of which can be embedded here without making
// fabrication.proto depend on elements.proto. The class is stored by name and
// the elements by guid, which is what a consumer needs to resolve them.
message BTLxFromGeometryDefinitionData {
  string guid = 1;
  optional string name = 2;
  string processing_name = 10;
  repeated compas_pb.data.AnyData geometries = 11;
  repeated string element_guids = 12;
  map<string, compas_pb.data.AnyData> kwargs = 13;
}

// Polymorphic wrapper: any BTLxProcessing instance.
message BTLxProcessingData {
  oneof processing {
    JackRafterCutData jack_rafter_cut = 1;
    DoubleCutData double_cut = 2;
    DrillingData drilling = 3;
    LapData lap = 4;
    MortiseData mortise = 5;
    TenonData tenon = 6;
    PocketData pocket = 7;
    SlotData slot = 8;
    StepJointData step_joint = 9;
    StepJointNotchData step_joint_notch = 10;
    DovetailTenonData dovetail_tenon = 11;
    DovetailMortiseData dovetail_mortise = 12;
    FrenchRidgeLapData french_ridge_lap = 13;
    BirdsMouthData birds_mouth = 14;
    LongitudinalCutData longitudinal_cut = 15;
    SimpleScarfData simple_scarf = 16;
    TextData text = 17;
    FreeContourData free_contour = 18;
  }
}
