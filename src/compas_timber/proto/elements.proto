syntax = "proto3";

package compas_timber.proto;

import "compas_pb/generated/geometry.proto";
import "compas_pb/generated/message.proto";
import "compas_timber/proto/common.proto";
import "compas_timber/proto/fabrication.proto";
import "compas_timber/proto/panel_features.proto";

// Timber elements (compas_timber.elements).
//
// Proto has no inheritance, so fields of TimberElement / Element are copied
// into each concrete message. `guid` and `name` come from the compas
// serialization envelope rather than from __data__.
//
// `attributes` carries the open-ended kwargs dict that TimberElement, Plate
// and Panel merge into their __data__ via `data.update(self.attributes)`.

message PlateGeometryData {
  GuidRef guid = 1;
  optional string name = 2;
  compas_pb.data.PolylineData local_outline_a = 10;
  compas_pb.data.PolylineData local_outline_b = 11;
  compas_pb.data.FrameData frame = 12;
  optional double length = 13;
  optional double width = 14;
  optional double thickness = 15;
}

message LayerDefinitionData {
  GuidRef guid = 1;
  optional string name = 2;
  optional double thickness = 10;
  repeated LayerDefinitionData sublayer_defs = 11;  // recursive
}

message LayerStructureData {
  GuidRef guid = 1;
  optional string name = 2;
  repeated LayerDefinitionData layer_defs = 10;
}

// Wrapper so that a None layer_path stays distinct from an empty tuple.
message LayerPath {
  repeated int32 indices = 1;
}

message LayerData {
  GuidRef guid = 1;
  optional string name = 2;
  PlateGeometryData plate_geometry = 10;
  optional double start_offset = 11;
  optional LayerPath layer_path = 12;
}

message BeamData {
  GuidRef guid = 1;
  optional string name = 2;
  // TimberElement
  compas_pb.data.FrameData frame = 10;
  optional double length = 11;
  optional double width = 12;
  optional double height = 13;
  repeated BTLxProcessingData features = 14;
  map<string, compas_pb.data.AnyData> attributes = 15;
}

message PlateData {
  GuidRef guid = 1;
  optional string name = 2;
  PlateGeometryData plate_geometry = 10;
  repeated BTLxProcessingData features = 11;
  map<string, compas_pb.data.AnyData> attributes = 12;
}

message PanelData {
  GuidRef guid = 1;
  optional string name = 2;
  PlateGeometryData plate_geometry = 10;
  optional string type = 11;
  repeated PanelFeatureData features = 12;
  optional LayerStructureData layer_structure = 13;
  map<string, compas_pb.data.AnyData> attributes = 14;
}

// Fasteners (compas_timber.fasteners): the anchor-based fastener system.
//
// `Fastener` is a resolved, model-ready container element with no geometry of
// its own -- its parts (below) carry the geometry and are its children in the
// model tree. `FastenerSystem` and its subclasses are the design-time recipes
// that build a `Fastener`; they are plain `Data`, never part of a model, and
// have no proto message of their own.
//
// `frame`/`placement_frame` below mirror each class' `placement_frame`
// property, which is never `None` (it defaults to the world XY frame), so
// unlike most message fields these are not `optional`.

message FastenerData {
  GuidRef guid = 1;
  optional string name = 2;
  compas_pb.data.FrameData frame = 10;
}

// One entry of RectangularPlate.holes.
message PlateHoleData {
  GuidRef guid = 1;
  optional string name = 2;
  compas_pb.data.FrameData frame = 10;
  optional double diameter = 11;
  optional double height = 12;
  optional bool apply_drilling = 13;
  optional double drilling_depth = 14;
  optional double drilling_diameter = 15;
}

message ScrewData {
  GuidRef guid = 1;
  optional string name = 2;
  optional double diameter = 10;
  optional double length = 11;
  optional bool precise = 12;
  optional double head_diameter = 13;
  optional double head_length = 14;
  compas_pb.data.FrameData placement_frame = 15;
  repeated GuidRef element_guids = 16;
}

message DowelData {
  GuidRef guid = 1;
  optional string name = 2;
  optional double diameter = 10;
  optional double length = 11;
  compas_pb.data.FrameData placement_frame = 12;
  repeated GuidRef element_guids = 13;
}

message RectangularPlateData {
  GuidRef guid = 1;
  optional string name = 2;
  optional double width = 10;
  optional double height = 11;
  optional double thickness = 12;
  compas_pb.data.FrameData frame = 13;
  optional double recess = 14;
  optional double recess_offset = 15;
  repeated PlateHoleData holes = 16;
  repeated GuidRef element_guids = 17;
}

// A fastener part with explicit, arbitrary geometry (a custom fastener, or one
// pulled from a library). `geometry` stays AnyData: it takes any compas solid,
// Brep included, and Brep has no proto message to point a oneof at.
message GeometryPartData {
  GuidRef guid = 1;
  optional string name = 2;
  optional compas_pb.data.AnyData geometry = 10;
  compas_pb.data.FrameData frame = 11;
}

message BallNodeCoreData {
  GuidRef guid = 1;
  optional string name = 2;
  optional double diameter = 10;
  compas_pb.data.FrameData frame = 11;
}

message BallNodeRodData {
  GuidRef guid = 1;
  optional string name = 2;
  optional double length = 10;
  optional double diameter = 11;
  compas_pb.data.FrameData frame = 12;
}

message BallNodePlateData {
  GuidRef guid = 1;
  optional string name = 2;
  optional double x_size = 10;
  optional double y_size = 11;
  optional double thickness = 12;
  compas_pb.data.FrameData frame = 13;
  optional double plate_depth = 14;
  repeated GuidRef element_guids = 15;
}

// The design-time parameters shaping a BallNodeFastenerSystem. Not an
// Element -- referenced from BallNodeJointData.parameters, never a model tree
// node in its own right.
message BallNodeFastenerParametersData {
  GuidRef guid = 1;
  optional string name = 2;
  optional double ball_diameter = 10;
  optional double rods_length = 11;
  optional double plate_thickness = 12;
  optional double plate_depth = 13;
}

// A plain compas_model Element, for models that hold elements which are not
// timber elements. Mirrors Element.__data__ exactly -- note that `geometry` is
// not part of it and so is not carried here.
message GenericElementData {
  GuidRef guid = 1;
  optional string name = 2;
  optional compas_pb.data.TransformationData transformation = 10;
  repeated ModelFeatureData features = 11;
  // Element.__data__["material"] is the guid of a material held by the model,
  // not the material itself.
  optional GuidRef material = 12;
}

// Polymorphic wrapper: any element that can live in a TimberModel.
message ElementData {
  oneof element {
    BeamData beam = 1;
    PlateData plate = 2;
    PanelData panel = 3;
    LayerData layer = 4;
    FastenerData fastener = 5;
    ScrewData screw = 6;
    DowelData dowel = 7;
    PanelFeatureData panel_feature = 8;
    GenericElementData generic_element = 9;
    RectangularPlateData rectangular_plate = 10;
    GeometryPartData geometry_part = 11;
    BallNodeCoreData ball_node_core = 12;
    BallNodeRodData ball_node_rod = 13;
    BallNodePlateData ball_node_plate = 14;
  }
}
