# ============================================================================
# Project info
# ============================================================================

[project]
name = "compas_timber"
description = "COMPAS package for modeling, designing and fabricating timber assemblies."
authors = [
    {name = "Aleksandra Anna Apolinarska"},
    {name = "Chen Kasirer"},
    {name = "Gonzalo Casas"},
    {name = "Jonas Haldemann"},
    {name = "Oliver Appling Bucklin"},
    {name = "Aurèle L. Gheyselinck"},
    {name = "Panayiotis Papacharalambous"},
    {name = "Anastasiia Stryzhevska"},
    {name = "Jelle Feringa"},
    {name = "Joseph Kenny"},
    {name = "Beverly Lytle"},
    {name = "Eric Gozzi"},
    {name = "Rodrigo Arca Zimmermann"},
    {name = "Nicolas Benjamin Boscoboinik"},
    {name = "Paul Jaeggi"},
    {name = "Daniel Nunes Locatelli"},
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "rtree",
    "compas >=2.15.1, <3.0",
    "compas_model == 0.9.2", # pin until first release
    "scipy >= 1.1",
    "compas_brep >= 0.1.3"
]

[project.optional-dependencies]
dev = [
    "bump-my-version",
    "compas_invocations2[mkdocs]>=1.0.2",
    "mkdocs-panzoom-plugin",
    "invoke >=0.14",
    "ruff",
    "twine",
    "wheel",
    "pytest-mock",
    "pytest>=8.0",
    "build",
    "tomlkit",
    "pytest-cov",
    "pytest-randomly",
    "pre-commit",
    "pyyaml",
    "compas_brep[occ]"
]

gh = [
    "compas_invocations2",
    "tomlkit",
    "pythonnet",
]

viz = [
    "compas_brep[occ]",
    "compas_viewer"
]

[project.urls]
Homepage = "https://gramaziokohler.github.io/compas_timber/latest/"
Repository = "https://github.com/gramaziokohler/compas_timber"

# ============================================================================
# Setup and build
# ============================================================================
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_timber.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]

# ============================================================================
# Release
# ============================================================================

[tool.bumpversion]
current_version = "2.2.0"
message = "Bump version to {new_version}"
commit = true
tag = true
parse = """(?x)
    (?P<major>0|[1-9]\\d*)\\.
    (?P<minor>0|[1-9]\\d*)\\.
    (?P<patch>0|[1-9]\\d*)
    (?:
        -                             # dash separator for pre-release section
        (?P<pre_l>[a-zA-Z-]+)         # pre-release label
        (?P<pre_n>0|[1-9]\\d*)        # pre-release version number
    )?                                # pre-release section is optional
"""
serialize = [
    "{major}.{minor}.{patch}-{pre_l}{pre_n}",
    "{major}.{minor}.{patch}",
]

[tool.bumpversion.parts.pre_l]
values = ["dev", "rc", "final"]
optional_value = "final"
first_value = "final"

[[tool.bumpversion.files]]
filename = "src/compas_timber/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# linting and formatting
# ============================================================================

[tool.black]
extend-exclude = '(/[a-zA-Z\./]*[\s]?)'  # exclude everything, black should be removed..

[tool.isort]
line_length = 179
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
force_single_line = true
ensure_newline_before_comments = true
known_first_party = "compas_timber"
default_section = "THIRDPARTY"
forced_separate = "test_compas_timber"

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = [
    "compas_timber",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# Testing
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "tests.py"
]
addopts = "-ra --strict --doctest-modules --doctest-glob=*.rst --tb=short"
doctest_optionflags= "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ALLOW_UNICODE ALLOW_BYTES NUMBER"
filterwarnings = "ignore::DeprecationWarning"
markers = [
    "requires_occ: marks tests that need the OCC Brep backend, which is not available on Python 3.9",
]
