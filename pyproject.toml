# ============================================================================
# Project info
# ============================================================================

[project]
name = "compas_timber"
description = "COMPAS package for modeling, designing and fabricating timber assemblies."
authors = [
    { name = "Aleksandra Anna Apolinarska", email = "apolinarska@arch.ethz.ch" },
    { name = "Chen Kasirer", email = "kasirer@arch.ethz.ch" },
    { name = "Gonzalo Casas", email = "casas@arch.ethz.ch" },
    { name = "Jonas Haldemann", email = "haldemann@arch.ethz.ch" },
    { name = "Oliver Appling Bucklin", email = "bucklin@arch.ethz.ch" },
    { name = "Aurèle L. Gheyselinck", email = "gheyselinck@arch.ethz.ch" },
    { name = "Panayiotis Papacharalambous", email = "papacharalambous@arch.ethz.ch" },
    { name = "Anastasiia Stryzhevska", email = "astryzhevska@arch.ethz.ch" },
    { name = "Jelle Feringa", email = "jelleferinga@gmail.com" },
    { name = "Joseph Kenny", email = "jk6372@princeton.edu" },
    { name = "Beverly Lytle", email = "lytle@arch.ethz.ch" },
    { name = "Eric Gozzi", email = "eric.gozzi@arch.ethz.ch" },
    { name = "Rodrigo Arca Zimmermann", email = "rodrigo.arca@gmail.com" },
    { name = "Nicolas Benjamin Boscoboinik", email = "boscoboinik@arch.ethz.ch" },
    { name = "Paul Jaeggi", email = "jaeggipa@ethz.ch" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "rtree",
    "compas >=2.15.1, <3.0",
    "compas_model == 0.9.2", # pin until first release
    "scipy >= 1.1",
    "compas_brep >= 0.1.3",
    "compas_pb >= 1.2.0, < 2.0",
]

[project.optional-dependencies]
dev = [
    "bump-my-version",
    "compas_invocations2[mkdocs]>=1.0.2",
    "mkdocs-panzoom-plugin",
    "invoke >=0.14",
    "ruff",
    "twine",
    "wheel",
    "pytest-mock",
    "pytest>=8.0",
    "build",
    "tomlkit",
    "pytest-cov",
    "pytest-randomly",
    "pre-commit",
    "compas_brep[occ]"
]

gh = [
    "compas_invocations2",
    "tomlkit",
    "pythonnet",
]

viz = [
    "compas_brep[occ]",
    "compas_viewer"
]

[project.urls]
Homepage = "https://gramaziokohler.github.io/compas_timber/latest/"
Repository = "https://github.com/gramaziokohler/compas_timber"

[project.entry-points.'compas_pb.plugins']
serializers = 'compas_timber.proto.conversions'

# ============================================================================
# Setup and build
# ============================================================================
[build-system]
requires = ["setuptools>=68", "wheel", "compas_pb >= 1.2.0, < 2.0", "grpcio-tools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "compas_timber.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]

# ============================================================================
# Release
# ============================================================================

# `release-pr` bumps the version and `release-check` validates it; both support
# stable semantic versions only, and both drive the commit/tag through the
# release pull request rather than through bump-my-version.
[tool.bumpversion]
current_version = "2.2.0"
message = "Bump version to {new_version}"
commit = false
tag = false

[[tool.bumpversion.files]]
filename = "src/compas_timber/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

# ============================================================================
# linting and formatting
# ============================================================================

[tool.black]
extend-exclude = '(/[a-zA-Z\./]*[\s]?)'  # exclude everything, black should be removed..

[tool.isort]
line_length = 179
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
force_single_line = true
ensure_newline_before_comments = true
known_first_party = "compas_timber"
default_section = "THIRDPARTY"
forced_separate = "test_compas_timber"

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py39"
# protoc-generated modules are not authored by hand and are regenerated by
# `invoke pre_build`; linting them makes `invoke lint` fail in CI.
extend-exclude = ["*_pb2.py", "*_pb2.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = [
    "compas_timber",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pycodestyle]
max-doc-length = 179

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ============================================================================
# Testing
# ============================================================================

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
python_files = [
    "test_*.py",
    "tests.py"
]
addopts = "-ra --strict --doctest-modules --doctest-glob=*.rst --tb=short"
doctest_optionflags= "NORMALIZE_WHITESPACE IGNORE_EXCEPTION_DETAIL ALLOW_UNICODE ALLOW_BYTES NUMBER"
filterwarnings = "ignore::DeprecationWarning"
markers = [
    "requires_occ: marks tests that need the OCC Brep backend, which is not available on Python 3.9",
]
